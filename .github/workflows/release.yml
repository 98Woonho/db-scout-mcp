# 태그(v*)를 push하면 jar를 만들어 GitHub Release에 올린다.
# 플러그인 실행기(plugin/bin/Launch.java)는 플러그인 버전과 같은 태그의 Release에서 jar와 해시 파일을 받는다.
# 시크릿 없이 저장소 기본 토큰(GITHUB_TOKEN)만 쓴다.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # Release 만들기

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: 태그와 버전 일치 확인
        run: |
          GRADLE_VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          PLUGIN_VERSION=$(grep -oP '"version"\s*:\s*"\K[^"]+' plugin/.claude-plugin/plugin.json)
          echo "태그 $GITHUB_REF_NAME / gradle.properties $GRADLE_VERSION / plugin.json $PLUGIN_VERSION"
          if [ "v$GRADLE_VERSION" != "$GITHUB_REF_NAME" ] || [ "$GRADLE_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "::error::태그, gradle.properties, plugin.json 의 버전이 모두 같아야 합니다."
            exit 1
          fi

      # 통합 테스트(MySQL·PostgreSQL)는 CI 워크플로가 push마다 이미 돌린다. 여기서는 단위 테스트만.
      - name: 빌드와 테스트
        run: ./gradlew build --console=plain

      - name: jar 해시 만들기
        working-directory: build/libs
        run: |
          sha256sum db-scout-mcp.jar > db-scout-mcp.jar.sha256
          cat db-scout-mcp.jar.sha256

      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/libs/db-scout-mcp.jar build/libs/db-scout-mcp.jar.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
