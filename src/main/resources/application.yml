spring:
  application:
    name: db-scout
  main:
    banner-mode: off                # 표준출력은 MCP 메시지 전용
    web-application-type: none
  ai:
    mcp:
      server:
        name: db-scout
        version: "@version@"        # Gradle 빌드 때 프로젝트 버전으로 바뀜
        type: SYNC
        stdio: true
        instructions: >-
          데이터베이스 구조를 파악하고 읽기 전용으로 조회하는 서버입니다.
          쓰기 쿼리는 실행되지 않고, 행 수·실행 시간이 제한되며, 개인정보 컬럼은 가려진 채로 돌려줍니다.
          먼저 list_connections로 사용할 접속을 확인하세요.

# 접속 하나는 환경변수로 등록한다. 여러 개는 설정 파일(--spring.config.additional-location)의 목록으로 등록한다.
# URL이 비어 있으면 내장 Sakila 데모 DB로 실행된다.
db-scout:
  connections:
    - name: ${DB_SCOUT_NAME:main}
      url: ${DB_SCOUT_URL:}
      username: ${DB_SCOUT_USERNAME:}
      password: ${DB_SCOUT_PASSWORD:}
      description: ${DB_SCOUT_DESCRIPTION:}
      # 쉼표로 구분. 예) customer.first_name, member.nickname=secret
      mask-columns: ${DB_SCOUT_MASK_COLUMNS:}
      unmask-columns: ${DB_SCOUT_UNMASK_COLUMNS:}
      # 도구에서 숨기고 조회도 막을 테이블. 예) audit_log, hr.salary
      hidden-tables: ${DB_SCOUT_HIDDEN_TABLES:}
